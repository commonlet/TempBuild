# .github/workflows/build.yml
name: build

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: windows-2025-vs2026
    
    steps:
      - name: Install rclone
        run: winget install Rclone.Rclone --source winget
        shell: pwsh

      - name: Refresh PATH environment variable
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          rclone --version
        shell: pwsh

      - name: Restore rclone config from Secret
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG }}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.config\rclone" | Out-Null
          [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($env:RCLONE_CONFIG_BASE64)) | Out-File -FilePath "$env:USERPROFILE\.config\rclone\rclone.conf" -Encoding utf8
        shell: pwsh

      - name: Sync specific folder from OneDrive to D drive
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          New-Item -ItemType Directory -Force -Path "D:\YCL-PlatformSDK" | Out-Null
          rclone copy "drive:YCL-PlatformSDK" D:\YCL-PlatformSDK --transfers 32 --checkers 32 --drive-chunk-size 64M --fast-list --progress --stats 1m
        shell: pwsh

      - name: Trim PATH to essential entries only
        shell: pwsh
        run: |
          $machinePath = [System.Environment]::GetEnvironmentVariable("Path", "Machine")
          $userPath = [System.Environment]::GetEnvironmentVariable("Path", "User")
          $allPaths = ($machinePath + ";" + $userPath) -split ';'
          
          # 只保留包含这些关键词的路径（不区分大小写）
          $keywords = @(
            'Windows Kits',
            'dotnet',
            'Git',
            '.dotnet',
            'Microsoft',
            'system32',
            'Windows'
          )
          
          $filteredPaths = $allPaths | Where-Object {
            $keep = $false
            foreach ($keyword in $keywords) {
              if ($_ -match $keyword) {
                $keep = $true
                break
              }
            }
            $keep
          } | Select-Object -Unique
          
          # 确保关键路径存在，如果过滤后为空则添加默认路径
          if ($filteredPaths.Count -eq 0) {
            Write-Host "⚠️ No paths matched, keeping full PATH" -ForegroundColor Yellow
            $newPath = $allPaths -join ';'
          } else {
            $newPath = $filteredPaths -join ';'
            Write-Host "Trimmed PATH from $($allPaths.Count) to $($filteredPaths.Count) entries" -ForegroundColor Green
          }
          
          $env:Path = $newPath

      - name: Execute init.ps1 and build
        shell: pwsh
        run: |
          # 刷新 PATH 以确保 rclone 可用
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          
          # 切换到项目目录
          Set-Location -Path "D:\YCL-PlatformSDK"
          
          # 执行 init.ps1 脚本
          Write-Host "Executing init.ps1..." -ForegroundColor Yellow
          .\init.ps1
          
          # 如果 init.ps1 执行成功，继续后续构建
          if ($LASTEXITCODE -eq 0) {
              Write-Host "init.ps1 completed successfully." -ForegroundColor Green
              
              # 1. 在 PackageReference 目录执行 msbuild
              Write-Host "`nBuilding PackageReference..." -ForegroundColor Yellow
              Set-Location -Path "D:\YCL-PlatformSDK\eng\PackageReference"
              msbuild /p:Platform=x64
              
              # 2. 在 dev\DXaml 目录执行 msbuild
              Write-Host "`nBuilding DXaml..." -ForegroundColor Yellow
              Set-Location -Path "D:\YCL-PlatformSDK\dev\DXaml"
              msbuild
              
              # 3. 执行指定的 vcxproj 构建命令（所有参数合并为一行）
              Write-Host "`nBuilding Microsoft.ui.xaml.vcxproj..." -ForegroundColor Yellow
              Set-Location -Path "D:\YCL-PlatformSDK"
              msbuild "D:\YCL-PlatformSDK\dev\DXaml\xcp\dxaml\dllsrv\winrt\native\Microsoft.ui.xaml.vcxproj" -v:q /p:Platform=x64 /p:Configuration=Release /graph /reportfileaccesses /p:MSBuildCacheEnabled=true /p:MSBuildCacheLogDirectory="D:\YCL-PlatformSDK\BuildOutput\Log" /p:MSBuildCacheLocalCacheRootPath="D:\YCL-PlatformSDK\BuildOutput\Temp"
          } else {
              Write-Host "init.ps1 failed with exit code: $LASTEXITCODE" -ForegroundColor Red
              exit $LASTEXITCODE
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: winui-build-artifacts
          path: |
            D:\YCL-PlatformSDK\BuildOutput\bin\amd64fre\Product\Microsoft.ui.xaml.dll
            D:\YCL-PlatformSDK\BuildOutput\bin\amd64fre\Product\en-us
          if-no-files-found: warn
          retention-days: 7
