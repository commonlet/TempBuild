# .github/workflows/build.yml
name: build

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: windows-2025-vs2026
    
    steps:
      - name: Install rclone
        run: winget install Rclone.Rclone --source winget
        shell: pwsh

      - name: Refresh PATH environment variable
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          rclone --version
        shell: pwsh

      - name: Restore rclone config from Secret
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG }}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.config\rclone" | Out-Null
          [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($env:RCLONE_CONFIG_BASE64)) | Out-File -FilePath "$env:USERPROFILE\.config\rclone\rclone.conf" -Encoding utf8
        shell: pwsh

      - name: Sync specific folder from OneDrive to D drive
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          New-Item -ItemType Directory -Force -Path "D:\YCL-PlatformSDK" | Out-Null
          rclone copy "drive:YCL-PlatformSDK" D:\YCL-PlatformSDK --transfers 8 --checkers 32 --drive-chunk-size 64M --fast-list --progress --stats 1m
        shell: pwsh

      - name: Setup build environment and build
        shell: pwsh
        run: |
          $repoRoot = "D:\YCL-PlatformSDK"
          
          Set-Location -Path $repoRoot
          
          .\init.ps1 amd64chk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          
          Write-Host "Building PackageReference..."
          Set-Location -Path "$repoRoot\eng\PackageReference"
          dotnet msbuild /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          
          Write-Host "Building DXaml..."
          Set-Location -Path "$repoRoot\dev\DXaml"
          msbuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          
          Write-Host "Building Microsoft.ui.xaml.vcxproj..."
          Set-Location -Path $repoRoot
          msbuild dev\DXaml\xcp\dxaml\dllsrv\winrt\native\Microsoft.ui.xaml.vcxproj -v:q /p:Platform=x64 /p:Configuration=Release /graph /reportfileaccesses /p:MSBuildCacheEnabled=true /p:MSBuildCacheLogDirectory="D:\YCL-PlatformSDK\BuildOutput\Log" /p:MSBuildCacheLocalCacheRootPath="D:\YCL-PlatformSDK\BuildOutput\Temp"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: winui-build-artifacts
          path: |
            D:\YCL-PlatformSDK\BuildOutput\bin\amd64fre\Product\Microsoft.ui.xaml.dll
            D:\YCL-PlatformSDK\BuildOutput\bin\amd64fre\Product\en-us
          if-no-files-found: warn
          retention-days: 7
