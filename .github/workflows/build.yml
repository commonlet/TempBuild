# .github/workflows/build.yml
name: build

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: windows-2025-vs2026
    
    steps:
      - name: Install rclone
        run: winget install Rclone.Rclone --source winget
        shell: pwsh

      - name: Refresh PATH environment variable
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          rclone --version
        shell: pwsh

      - name: Setup rclone with Service Account
        shell: pwsh
        env:
          GDRIVE_SERVICE_JSON: ${{ secrets.GDRIVE_SERVICE_JSON }}
        run: |
          # 1. 解码 Base64 到临时 JSON 文件
          $saJsonPath = "$env:RUNNER_TEMP\gdrive-service-account.json"
          [IO.File]::WriteAllBytes($saJsonPath, [Convert]::FromBase64String($env:GDRIVE_SERVICE_JSON))
          Write-Host "Service account JSON written to: $saJsonPath"

          # 2. 生成 rclone.conf，root_folder_id 指向共享的代码文件夹
          $rcloneDir = "$env:USERPROFILE\.config\rclone"
          New-Item -ItemType Directory -Force -Path $rcloneDir | Out-Null

          $rcloneConf = @"
          [drive]
          type = drive
          scope = drive
          service_account_file = $saJsonPath
          root_folder_id = 1xp4ac1FUWHkQ-WUFbGiB6rody6lQIMgb
          "@

          $rcloneConf | Out-File -FilePath "$rcloneDir\rclone.conf" -Encoding utf8
          Write-Host "rclone.conf written."

          # 3. 验证
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          rclone listremotes
          rclone lsd drive:

      - name: Sync specific folder from Google Drive to D drive
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          New-Item -ItemType Directory -Force -Path "D:\YCL-PlatformSDK" | Out-Null
          # root_folder_id 已指向 YCL-PlatformSDK，直接用 drive:
          rclone copy "drive:" D:\YCL-PlatformSDK --transfers 8 --checkers 32 --drive-chunk-size 64M --fast-list --progress --stats 1m
        shell: pwsh

      - name: Setup build environment and build
        shell: pwsh
        run: |
          $repoRoot = "D:\YCL-PlatformSDK"
          
          Set-Location -Path $repoRoot
          
          .\init.ps1 amd64chk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          
          Write-Host "Building PackageReference..."
          Set-Location -Path "$repoRoot\eng\PackageReference"
          dotnet msbuild /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          
          Write-Host "Building DXaml..."
          Set-Location -Path "$repoRoot\dev\DXaml"
          msbuild
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          
          Write-Host "Building Microsoft.ui.xaml.vcxproj..."
          Set-Location -Path $repoRoot
          msbuild dev\DXaml\xcp\dxaml\dllsrv\winrt\native\Microsoft.ui.xaml.vcxproj -v:q /p:Platform=x64 /p:Configuration=Release /graph /reportfileaccesses /p:MSBuildCacheEnabled=true /p:MSBuildCacheLogDirectory="D:\YCL-PlatformSDK\BuildOutput\Log" /p:MSBuildCacheLocalCacheRootPath="D:\YCL-PlatformSDK\BuildOutput\Temp"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: winui-build-artifacts
          path: |
            D:\YCL-PlatformSDK\BuildOutput\bin\amd64fre\Product\Microsoft.ui.xaml.dll
            D:\YCL-PlatformSDK\BuildOutput\bin\amd64fre\Product\en-us
          if-no-files-found: warn
          retention-days: 7
