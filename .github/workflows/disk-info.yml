# .github/workflows/debug.yml
name: Interactive Debug Session

on:
  workflow_dispatch:
    inputs:
      enable_debug:
        description: 'Enable tmate debug session'
        type: boolean
        default: true

jobs:
  debug:
    runs-on: windows-2025-vs2026
    
    steps:
      # 可选：如果你想在调试前先拉取私有仓库代码，可以启用这个步骤
      # - name: Checkout private repository
      #   uses: actions/checkout@v4
      #   with:
      #     repository: your-username/your-private-repo
      #     token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
      #     path: D:\source

      - name: Setup tmate debug session
        uses: mxschmitt/action-tmate@v3
        with:
          # 限制只有触发此次工作流的用户才能连接
          limit-access-to-actor: true
          # 不限制连接超时，默认无限制
          timeout-minutes: 60