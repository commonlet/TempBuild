# .github/workflows/debug.yml
name: Interactive Debug Session

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run with upterm debugging enabled'
        required: false
        default: true

jobs:
  debug:
    runs-on: windows-2025-vs2026
    
    steps:
      - name: Setup upterm session
        id: upterm
        uses: owenthereal/action-upterm@v1
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        with:
          limit-access-to-actor: true
          detached: true
        timeout-minutes: 60

      - name: Display upterm connection info
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        run: |
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "    UPTERM CONNECTION INFORMATION" -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "SSH Command: ${{ steps.upterm.outputs.ssh-command }}"
          Write-Host "SSH Address: ${{ steps.upterm.outputs.ssh-address }}"
          Write-Host "Web URL: ${{ steps.upterm.outputs.web-url }}"
          Write-Host "========================================"
        shell: pwsh