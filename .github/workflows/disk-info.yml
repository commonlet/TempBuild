# .github/workflows/debug.yml
name: Interactive Debug Session

on:
  workflow_dispatch:
    inputs:
      enable_debug:
        description: 'Enable tmate debug session'
        type: boolean
        default: true

jobs:
  debug:
    runs-on: windows-2025-vs2026
    
    steps:
      - name: Setup tmate debug session
        uses: mxschmitt/action-tmate@a8c2cdd7f9e4d2a8c7b3e5f1d9c4a8b2c3d4e5f6  # 替换为实际完整的 commit SHA
        with:
          limit-access-to-actor: true
          timeout-minutes: 60