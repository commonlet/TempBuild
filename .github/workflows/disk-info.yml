# .github/workflows/system-info.yml
name: Windows System Information Viewer

on:
  workflow_dispatch:

jobs:
  system-info:
    runs-on: windows-2025-vs2026
    
    steps:
      - name: Get complete system information using Get-ComputerInfo
        shell: pwsh
        run: |
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "       WINDOWS SYSTEM INFORMATION" -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host ""
          
          # Get all computer info and display as formatted list
          Get-ComputerInfo | Format-List