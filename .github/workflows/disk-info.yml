# .github/workflows/system-info.yml
name: Windows System Information Viewer

on:
  workflow_dispatch:

jobs:
  system-info:
    runs-on: windows-2025-vs2026
    
    steps:
      # ... 你原有的 Get-ComputerInfo 步骤 ...

      - name: Benchmark disk performance
        shell: pwsh
        run: |
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "       DISK PERFORMANCE BENCHMARK" -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan
          
          Write-Host "`n--- Testing C: drive ---" -ForegroundColor Green
          winsat disk -seq -read -drive c
          winsat disk -seq -write -drive c
          
          Write-Host "`n--- Testing D: drive ---" -ForegroundColor Green
          winsat disk -seq -read -drive d
          winsat disk -seq -write -drive d