# .github/workflows/debug.yml
name: Interactive Debug Session

on:
  workflow_dispatch:
    inputs:
      enable_debug:
        description: 'Enable tmate debug session'
        type: boolean
        default: true

jobs:
  debug:
    runs-on: windows-2025-vs2026
    
    steps:
      - name: Setup tmate debug session
        uses: mxschmitt/action-tmate@3bbcb9c1150fbb652ce2b0d2f7c2e69804e43d10
        with:
          limit-access-to-actor: true
          timeout-minutes: 60