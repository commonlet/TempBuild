name: debug-path

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: windows-2025-vs2026
    
    steps:
      - name: Print all PATH entries
        shell: pwsh
        run: |
          Write-Host "=== All PATH Entries ===" -ForegroundColor Cyan
          Write-Host ""
          
          $paths = $env:Path -split ';' | Sort-Object
          $index = 1
          foreach ($p in $paths) {
            Write-Host "$index. $p"
            $index++
          }
          
          Write-Host ""
          Write-Host "=== Statistics ===" -ForegroundColor Cyan
          Write-Host "Total PATH entries: $($paths.Count)"
          
          $pathLength = $env:Path.Length
          Write-Host "PATH string length: $pathLength characters"
          
          if ($pathLength -gt 8000) {
            Write-Host "⚠️ PATH length exceeds 8191 character limit!" -ForegroundColor Red
          } else {
            Write-Host "✅ PATH length is within safe range." -ForegroundColor Green
          }

      - name: Print all environment variables
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=== All Environment Variables ===" -ForegroundColor Cyan
          Write-Host ""
          
          $envVars = Get-ChildItem env: | Sort-Object Name
          $index = 1
          foreach ($var in $envVars) {
            Write-Host "$index. $($var.Name)=$($var.Value)"
            $index++
          }
          
          Write-Host ""
          Write-Host "=== Statistics ===" -ForegroundColor Cyan
          Write-Host "Total environment variables: $($envVars.Count)"
          
          $totalLength = 0
          foreach ($var in $envVars) {
            $totalLength += "$($var.Name)=$($var.Value) ".Length
          }
          Write-Host "Total length of all env vars (as parameters): $totalLength characters"

      - name: Reduce environment variables
        shell: pwsh
        run: |
          Write-Host "=== Reducing Environment Variables ===" -ForegroundColor Cyan
          Write-Host ""
          
          $keepPatterns = @(
              'Microsoft',
              'Windows',
              'dotnet',
              'PowerShell',
              'Git'
          )
          
          $excludePatterns = @('hostedtoolcache')
          
          $filteredPaths = ($env:PATH -split ';') | Where-Object {
              $path = $_
              if ([string]::IsNullOrWhiteSpace($path)) { return $false }
          
              $exclude = $excludePatterns | Where-Object { $path -like "*$_*" }
              if ($exclude) { return $false }
          
              $keep = $keepPatterns | Where-Object { $path -like "*$_*" }
              return [bool]$keep
          } | Select-Object -Unique
          
          $newPath = $filteredPaths -join ';'
          
          $excludeVarPatterns = @(
              'ANDROID',
              'ANT_HOME',
              'CABAL_DIR',
              'CONDA',
              'GHCUP',
              'GOROOT',
              'GRADLE_HOME',
              'JAVA_HOME',
              'M2',
              'M2_REPO',
              'MAVEN_OPTS',
              'npm_config_prefix',
              'RTOOLS45_HOME',
              'SBT_HOME',
              'VCPKG_INSTALLATION_ROOT',
              'ChromeWebDriver',
              'EdgeWebDriver',
              'GeckoWebDriver',
              'IEWebDriver',
              'SELENIUM_JAR_PATH',
              'PG',
              'AZ_DEVOPS',
              'AZURE',
              'COBERTURA_HOME',
              'PIPX',
              'PHPROOT',
              'WIX',
              'PSModuleAnalysisCachePath',
              'DriverData',
              'ChocolateyInstall'
          )
          
          $allVars = Get-ChildItem Env:
          $keepVars = @{}
          $removedCount = 0
          foreach ($var in $allVars) {
              $name = $var.Name
              if ($name -eq 'PATH' -or $name -eq 'Path') {
                  $keepVars[$name] = $newPath
                  continue
              }
              $exclude = $excludeVarPatterns | Where-Object { $name -match $_ }
              if (-not $exclude) {
                  $keepVars[$name] = $var.Value
              } else {
                  $removedCount++
              }
          }
          
          Write-Host "Keeping $($keepVars.Count) variables, removing $removedCount variables"
          
          $env:PATH = $newPath
          
          if ($env:GITHUB_ENV) {
              $null | Set-Content -Path $env:GITHUB_ENV
              foreach ($key in $keepVars.Keys) {
                  Add-Content -Path $env:GITHUB_ENV -Value "$key=$($keepVars[$key])"
              }
              Write-Host "Updated GITHUB_ENV with $($keepVars.Count) variables"
          }
          
          foreach ($var in $allVars) {
              $name = $var.Name
              if ($name -eq 'PATH' -or $name -eq 'Path') { continue }
              $exclude = $excludeVarPatterns | Where-Object { $name -match $_ }
              if ($exclude) {
                  Remove-Item -Path "Env:$name" -ErrorAction SilentlyContinue
              }
          }
          
          Write-Host "Environment variables reduced successfully!" -ForegroundColor Green

      - name: Print PATH after reduction
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=== PATH After Reduction ===" -ForegroundColor Cyan
          Write-Host ""
          
          $paths = $env:Path -split ';' | Sort-Object
          $index = 1
          foreach ($p in $paths) {
            Write-Host "$index. $p"
            $index++
          }
          
          Write-Host ""
          Write-Host "=== Statistics ===" -ForegroundColor Cyan
          Write-Host "Total PATH entries after reduction: $($paths.Count)"
          
          $pathLength = $env:Path.Length
          Write-Host "PATH string length after reduction: $pathLength characters"
          
          if ($pathLength -gt 8000) {
            Write-Host "⚠️ PATH length exceeds 8191 character limit!" -ForegroundColor Red
          } else {
            Write-Host "✅ PATH length is within safe range." -ForegroundColor Green
          }

      - name: Verify reduced environment
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=== Verifying Reduced Environment ===" -ForegroundColor Cyan
          Write-Host ""
          
          $envVars = Get-ChildItem env: | Sort-Object Name
          
          $badPatterns = @(
              'ANDROID',
              'ANT_HOME',
              'CABAL_DIR',
              'CONDA',
              'GHCUP',
              'GOROOT',
              'GRADLE_HOME',
              'JAVA_HOME',
              'M2',
              'M2_REPO',
              'MAVEN_OPTS',
              'npm_config_prefix',
              'RTOOLS45_HOME',
              'SBT_HOME',
              'VCPKG_INSTALLATION_ROOT',
              'ChromeWebDriver',
              'EdgeWebDriver',
              'GeckoWebDriver',
              'IEWebDriver',
              'SELENIUM_JAR_PATH',
              'PG',
              'AZ_DEVOPS',
              'AZURE',
              'COBERTURA_HOME',
              'PIPX',
              'PHPROOT',
              'WIX',
              'PSModuleAnalysisCachePath',
              'DriverData',
              'ChocolateyInstall'
          )
          
          $foundBad = $false
          foreach ($var in $envVars) {
              foreach ($pattern in $badPatterns) {
                  if ($var.Name -match $pattern) {
                      Write-Host "❌ Found unwanted variable: $($var.Name)" -ForegroundColor Red
                      $foundBad = $true
                  }
              }
          }
          
          if ($foundBad) {
              Write-Host "❌ Environment still contains unwanted variables!" -ForegroundColor Red
          } else {
              Write-Host "✅ All unwanted variables removed!" -ForegroundColor Green
          }
          
          Write-Host ""
          Write-Host "Total environment variables: $($envVars.Count)"
          
          $totalLength = 0
          foreach ($var in $envVars) {
              $totalLength += "$($var.Name)=$($var.Value) ".Length
          }
          Write-Host "Total length: $totalLength characters"
          
          Write-Host ""
          Write-Host "=== All Environment Variables After Reduction ===" -ForegroundColor Cyan
          Write-Host ""
          
          $index = 1
          foreach ($var in $envVars) {
              Write-Host "$index. $($var.Name)=$($var.Value)"
              $index++
          }

      - name: Test command length after reduction
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=== Command Length Test After Reduction ===" -ForegroundColor Cyan
          
          $envVars = Get-ChildItem env: | ForEach-Object { "$($_.Name)=$($_.Value)" }
          $parameters = $envVars -join " "
          
          $environmentVariablesFile = "D:\temp\env.tmp"
          $workingDirectoryFile = "D:\temp\cd.tmp"
          $script = "tools\initScripts\init.cmd"
          
          $cmdCommand = " `"$script`" $parameters && set > `"$environmentVariablesFile`" && cd > `"$workingDirectoryFile`" "
          
          Write-Host "Parameters count: $($parameters.Length) characters"
          Write-Host "Total command length: $($cmdCommand.Length) characters"
          
          if ($cmdCommand.Length -gt 8191) {
            Write-Host "❌ Command length still EXCEEDS 8191 character limit!" -ForegroundColor Red
          } else {
            Write-Host "✅ Command length is now within limit." -ForegroundColor Green
          }
